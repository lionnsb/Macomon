name: Bug report
description: Something in the pixel world is not behaving correctly.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Macomon.
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: macOS 15.6
    validations:
      required: true
  - type: input
    id: mac
    attributes:
      label: Mac model
      placeholder: MacBook Pro 14-inch, M3
  - type: input
    id: companion
    attributes:
      label: Selected companion
      placeholder: Baby Monkey, Pikachu, etc.
  - type: dropdown
    id: location
    attributes:
      label: Display location
      options:
        - Menu bar
        - Notch
        - Desktop
        - Active window / tab bar
        - Free placement
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: Tell us what you did and what happened.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
